<style>
:root{
  color-scheme: light;
  --cream:#f4e6d6; --cream2:#f8efe4; --ink:#1a1a1a; --maroon:#3a0f17; --maroon2:#4a1520;
  --blue:#1f5fe0; --yellow:#ffe14d; --red:#ef2f3c; --lime:#c6f25a; --green:#2fd65a;
  --sky:#18c8e0; --cloud:#f3dca0; --pink:#ff3d7f; --purple:#7a3cf0; --wallbg:#0f0f10; --wallink:#f2efe8;
  --display:'Anton', Impact, sans-serif; --body:'Space Grotesk', system-ui, sans-serif; --ui:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --herovw:11.2; --bodysize:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:var(--bodysize);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,svg{display:block}
input,textarea,select,button{color:var(--ink);font-family:inherit}
.display{font-family:var(--display);text-transform:uppercase;letter-spacing:.005em;line-height:.88}
.hide{display:none!important}

/* sticker system */
.sticker{border:2.5px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);background:#fff;color:var(--ink);transition:transform .25s cubic-bezier(.2,.9,.3,1.4), box-shadow .25s}
.sticker:hover{transform:translate(-2px,-2px) rotate(0deg)!important;box-shadow:7px 7px 0 var(--ink)}
.tag{display:inline-block;font-family:var(--display);text-transform:uppercase;font-size:13px;letter-spacing:.04em;padding:3px 8px;border:2px solid var(--ink);border-radius:5px;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.tag.yellow{background:var(--yellow)} .tag.red{background:var(--red);color:#fff} .tag.lime{background:var(--lime)}

/* HEADER */
header{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:center;align-items:center;gap:10px;padding:18px;pointer-events:none;transition:color .4s;color:var(--ink)}
header .logo{font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;pointer-events:auto}
header .pill{font:700 10px var(--body);text-transform:uppercase;letter-spacing:.08em;background:#b9f3b0;color:#1f6b2a;border-radius:99px;padding:3px 9px}
header nav{position:absolute;right:22px;display:flex;gap:18px;font-size:13px;font-weight:600;pointer-events:auto}
header nav a{position:relative}
header nav a::after{content:"";position:absolute;left:0;bottom:-3px;height:2px;width:0;background:currentColor;transition:width .3s}
header nav a:hover::after{width:100%}
body.stack-on header{color:#fff}
@media(max-width:760px){header nav{display:none}}

/* HERO */
#hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 4vw 60px;overflow:hidden}
#hero h1{font-size:clamp(44px,calc(var(--herovw) * 1vw),220px);color:var(--maroon)}
#hero h1 .line{display:block;overflow:hidden;padding-top:.06em}
#hero h1 .line span{display:inline-block}
#hero p.sub{max-width:540px;font-size:.9em;line-height:1.55;color:#5b4a43;margin-top:26px;position:relative;z-index:2}
#hero .hint2{margin-top:18px;font-size:12px;font-weight:600;letter-spacing:.06em;color:#9a8376;position:relative;z-index:5;transition:opacity .4s}
body.stack-on #hero .hint2{opacity:0}
.toggle-wrap{position:relative;z-index:5;display:block;height:0}
.tg-pos{position:absolute;left:50%;top:0;transform:translate(-50%,-38%);font-size:1em}
.toggle{font-size:inherit;width:2.1em;height:.92em;border-radius:1em;background:var(--cream2);cursor:pointer;border:none;position:relative;display:block;
  box-shadow:inset 0 .05em .12em rgba(0,0,0,.18), 0 .08em .25em rgba(58,15,23,.25), 0 0 0 .02em rgba(0,0,0,.05)}
.toggle .knob{position:absolute;top:.09em;left:.1em;width:.74em;height:.74em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4d86ff,var(--blue) 60%,#123fa8);
  box-shadow:0 .06em .14em rgba(0,0,0,.35);transition:left .55s cubic-bezier(.6,-0.2,.25,1.3), background .4s}
body.stack-on .toggle{background:#2a2a2a;box-shadow:inset 0 .05em .12em rgba(0,0,0,.6),0 0 0 .02em #444}
body.stack-on .toggle .knob{left:1.25em;background:radial-gradient(circle at 35% 30%,#8dff9c,var(--green) 60%,#139b36)}

/* role wall */
#stackwall{position:absolute;inset:0;z-index:4;background:var(--wallbg);opacity:0;pointer-events:none;transition:opacity .5s;overflow:hidden}
body.stack-on #stackwall{opacity:1;pointer-events:auto}
#stackwall .tilt{position:absolute;left:-30%;top:-40%;width:160%;height:180%;transform:rotate(-14deg);display:flex;flex-direction:column;justify-content:center;gap:1.2vw}
#stackwall .row{display:flex;gap:2vw;white-space:nowrap;width:max-content;animation:marq 38s linear infinite}
#stackwall .row:nth-child(even){animation-direction:reverse;animation-duration:46s}
#stackwall .w{font-family:var(--display);text-transform:uppercase;font-size:clamp(40px,7.5vw,128px);color:var(--wallink);line-height:1;display:flex;align-items:center;gap:2vw}
#stackwall .w i{display:inline-grid;place-items:center;width:.72em;height:.72em;border-radius:.12em;font-style:normal;font-size:.9em}
#stackwall .w i b{font-size:.45em;line-height:1}
#stackwall .w.o{color:transparent;-webkit-text-stroke:2px var(--wallink)}
@keyframes marq{to{transform:translateX(-50%)}}

/* ABOUT */
#about{position:relative;background:var(--blue);color:#fff;padding:0 0 110px;overflow:hidden}
#about .wave{display:block;width:100%;height:130px;background:var(--cream)}
#about .wave path{fill:var(--blue)}
#about .stage{position:relative;min-height:88vh;display:grid;place-items:center}
#about h2{position:absolute;left:5vw;top:2vh;font-size:clamp(52px,8vw,130px);color:rgba(255,255,255,.95);z-index:1}
.daisy{width:min(62vw,560px);aspect-ratio:1;position:relative;z-index:2}
.daisy svg{width:100%;height:100%}
.about-side{position:absolute;font-family:var(--display);text-transform:uppercase;font-size:clamp(22px,2.7vw,42px);line-height:.95;z-index:3}
.about-side.l{left:5vw;top:52%} .about-side.r{right:5vw;top:52%;text-align:right}
.about-side .y{color:var(--yellow)} .about-side .lm{color:var(--lime)}
.float{position:absolute;z-index:4}
.btn-resume{background:var(--ink);color:var(--yellow);font-family:var(--display);font-size:clamp(16px,1.8vw,24px);padding:8px 18px;border:2.5px solid var(--yellow);border-radius:6px;box-shadow:4px 4px 0 #000;letter-spacing:.04em}
.btn-contact{background:var(--lime);color:var(--ink);font:700 italic clamp(15px,1.6vw,22px) var(--body);padding:8px 20px;border:2.5px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--ink)}
.stat{font-family:var(--display);font-size:clamp(22px,2.6vw,38px);padding:4px 14px;border:2.5px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--ink);text-align:center;line-height:1.05}
.stat small{display:block;font:700 10px var(--body);text-transform:uppercase;letter-spacing:.06em}
.stat.red{background:var(--red);color:#fff} .stat.yellow{background:var(--yellow);color:var(--ink)} .stat.lime{background:var(--lime);color:var(--ink)}
.btn-resume:hover,.btn-contact:hover{transform:translate(-2px,-2px)}
#about .bio{max-width:640px;margin:10px auto 0;padding:0 6vw;text-align:center;font-size:clamp(16px,1.6vw,21px);line-height:1.55;position:relative;z-index:3}
@media(max-width:760px){
  .about-side{position:static;text-align:center!important;margin:8px 0}
  #about .stage{display:flex;flex-direction:column;padding-top:110px}
  #about h2{left:0;right:0;text-align:center}
}

/* PROJECTS */
#projects-intro{position:relative;height:100vh;display:grid;place-items:center;overflow:hidden}
#projects-intro .flash{position:absolute;inset:0;background:var(--yellow);z-index:3}
#projects-intro h2{font-size:clamp(56px,10vw,170px);color:var(--maroon);text-align:center}
#projects-intro p{text-align:center;margin-top:14px;font-weight:600;color:#7a6358}
#projects{padding:0 5vw 18vh;position:relative}
.pcard{position:sticky;top:12vh;max-width:980px;margin:0 auto 8vh;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);box-shadow:8px 8px 0 var(--ink);overflow:hidden;display:grid;grid-template-columns:1.25fr 1fr}
.pcard .shot{position:relative;min-height:360px;display:flex;flex-direction:column}
.pcard .chrome{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#ececec;border-bottom:2px solid var(--ink)}
.pcard .chrome b{width:10px;height:10px;border-radius:50%;background:#ff5f57}.pcard .chrome b:nth-child(2){background:#febc2e}.pcard .chrome b:nth-child(3){background:#28c840}
.pcard .chrome span{margin-left:10px;flex:1;background:#fff;border-radius:6px;padding:3px 10px;font-size:11px;color:#666;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pcard .art{flex:1;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:22px}
.pcard .art .big{font-family:var(--display);text-transform:uppercase;font-size:clamp(48px,7vw,104px);line-height:.85;position:relative;z-index:2}
.pcard .art .num{position:absolute;top:14px;right:18px;font-family:var(--display);font-size:20px;z-index:2;opacity:.9}
.pcard .art .blob{position:absolute;border-radius:50%;filter:blur(2px)}
.pcard .info{padding:30px 28px;display:flex;flex-direction:column;gap:16px;border-left:3px solid var(--ink)}
.pcard .info h3{font-family:var(--display);text-transform:uppercase;font-size:clamp(30px,3vw,44px);line-height:.95}
.pcard .info p{line-height:1.55;color:#444}
.pcard .tags{display:flex;flex-wrap:wrap;gap:6px}
.pcard .tags span{font-size:12px;font-weight:600;border:1.5px solid var(--ink);border-radius:99px;padding:3px 10px}
.pcard .visit{margin-top:auto;align-self:flex-start;background:var(--ink);color:#fff;font-weight:700;padding:11px 18px;border-radius:8px;display:inline-flex;gap:8px;align-items:center;transition:transform .2s,background .2s}
.pcard .visit:hover{transform:translateY(-2px);background:var(--blue)}
.pcard .domain{font-size:12px;color:#777;word-break:break-all}
@media(max-width:820px){.pcard{grid-template-columns:1fr;top:8vh}.pcard .info{border-left:none;border-top:3px solid var(--ink)}.pcard .shot{min-height:240px}}

/* CHRONICLE */
#chronicle{position:relative;height:100vh;overflow:hidden;display:grid;place-items:center}
#chronicle h2{font-size:clamp(60px,12.5vw,220px);color:var(--maroon);text-align:center;line-height:.86}
#chronicle h2 .ch{display:inline-block}
#chronicle .skyreveal{position:absolute;inset:0;background:var(--sky);clip-path:inset(46% 46% 46% 46% round 24px);z-index:3;overflow:hidden}

/* JOURNEY */
#journey{position:relative;background:var(--sky);padding:40px 3vw 90px;overflow:hidden;min-height:100vh;color:var(--ink)}
.clouds{position:absolute;inset:0;pointer-events:none}
.clouds svg{position:absolute;opacity:.95}
.clouds .c1{fill:var(--cloud)} .clouds .c2{fill:var(--cloud);filter:brightness(.9)}
.journey-title{position:relative;z-index:3;display:inline-block;margin:20px 0 0 2vw}
.journey-title .tag{position:absolute;top:-18px;left:10px;font-size:18px;transform:rotate(-4deg)}
.journey-title .main{font-family:var(--body);font-weight:700;font-size:clamp(28px,3.4vw,50px);letter-spacing:.06em;text-transform:uppercase;background:#fff;padding:6px 20px 4px;border:3px solid var(--ink);border-radius:8px;box-shadow:5px 5px 0 var(--ink);transform:rotate(-2deg);display:inline-block}
.road-wrap{position:relative;z-index:2;max-width:1280px;margin:10px auto 0;aspect-ratio:1200/640}
.road-wrap svg.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.jcard{position:absolute;width:clamp(170px,17vw,225px);background:#fff;border:2.5px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);padding:16px 12px 10px;font-size:11.5px;line-height:1.4}
.jcard .tag{position:absolute;top:-13px;left:12px;font-size:12px}
.jcard .badge{position:absolute;top:-12px;right:10px;font:700 10px var(--body);background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:99px;padding:2px 8px}
.jcard ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.jcard li{display:flex;gap:6px}
.jcard li::before{content:"✓";flex:none;width:13px;height:13px;border-radius:3px;background:var(--green);color:#fff;font-size:9px;display:grid;place-items:center;border:1.5px solid var(--ink);margin-top:1px}
.jcard a{font-weight:700;text-decoration:underline}
.jpin{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--red);border:3px solid var(--ink);transform:translate(-50%,-50%);z-index:3}
.plane{position:absolute;font-size:30px;z-index:4;transform:translate(-50%,-50%)}
@media(max-width:1000px){
  .road-wrap{aspect-ratio:auto;padding:30px 0 0 34px}
  .road-wrap svg.road,.jpin,.plane{display:none}
  .road-wrap::before{content:"";position:absolute;left:12px;top:20px;bottom:0;width:18px;background:#f6e7c1;border:3px solid var(--ink);border-radius:9px}
  .jcard{position:relative;left:auto!important;top:auto!important;transform:none!important;width:auto;max-width:420px;margin:0 0 30px 18px;font-size:13px}
}

/* SERVICES */
#services{position:relative;background:var(--cream2);padding:16vh 5vw 18vh;overflow:hidden}
#services .blob{position:absolute;z-index:0}
.svc-title{position:relative;z-index:2;text-align:center;margin-bottom:60px}
.svc-title .box{display:inline-block;position:relative;background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);padding:14px 36px 10px;transform:rotate(-2deg)}
.svc-title .box .tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(3deg);font-size:16px}

footer{position:relative;background:var(--maroon);color:var(--cream);overflow:hidden;padding-bottom:30px}

<script>
(function(){
function seoHead(C){
  const e = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const seo = C.seo || {}, name = C.name || '', role = C.role || '';
  const title = seo.title || `${name} — ${role} Portfolio`;
  const desc = seo.description || C.heroSub || '';
  const url = (seo.siteUrl || '').trim();
  const same = Object.values(C.socials || {}).map(s => s && s.url).filter(Boolean);
  const person = {"@context":"https://schema.org","@type":"Person","name":name,
    "alternateName":[name.replace(/\s+/g,''), name.split(' ')[0]].filter((v,i,a)=>v && a.indexOf(v)===i && v!==name),
    "jobTitle":role,"description":desc,"url":url||undefined,"email":C.email?('mailto:'+C.email):undefined,
    "sameAs":same.length?same:undefined,
    "knowsAbout":["Web development","AI coding","UI design","E-commerce websites"],
    "workExample":(C.projects||[]).filter(p=>p.url).map(p=>({"@type":"WebSite","name":p.title,"url":p.url}))};
  const site = {"@context":"https://schema.org","@type":"WebSite","name":title,"url":url||undefined,"author":{"@type":"Person","name":name}};
  const ld = o => JSON.stringify(o).replace(/</g,'\\u003c');
  const L = [
    `<title>${e(title)}</title>`,
    `<meta name="description" content="${e(desc)}">`,
    seo.keywords ? `<meta name="keywords" content="${e(seo.keywords)}">` : '',
    `<meta name="author" content="${e(name)}">`,
    `<meta name="robots" content="index, follow, max-image-preview:large">`,
    url ? `<link rel="canonical" href="${e(url)}">` : '',
    `<meta property="og:type" content="profile">`,
    `<meta property="og:site_name" content="${e(name)}">`,
    `<meta property="og:title" content="${e(title)}">`,
    `<meta property="og:description" content="${e(desc)}">`,
    url ? `<meta property="og:url" content="${e(url)}">` : '',
    `<meta name="twitter:card" content="summary">`,
    `<meta name="twitter:title" content="${e(title)}">`,
    `<meta name="twitter:description" content="${e(desc)}">`,
    seo.googleMeta ? `<meta name="google-site-verification" content="${e(String(seo.googleMeta).replace(/.*content="([^"]+)".*/,'$1').trim())}">` : '',
    `<script type="application/ld+json">${ld(person)}</`+`script>`,
    `<script type="application/ld+json">${ld(site)}</`+`script>`
  ].filter(Boolean);
  return '\n' + L.join('\n') + '\n';
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SS = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}}, set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}, del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const merge = (base, over) => { if(Array.isArray(over)) return over; if(over && typeof over==='object'){ const o={...base}; for(const k in over) o[k]=merge(base?base[k]:undefined, over[k]); return o;} return over===undefined?base:over; };

async function loadConfig(){
  let C = structuredClone(DEFAULT_CONFIG), live = C;
  const draft = LS.get('pf_draft');
  let previewing = false;
  if(draft){ try{ const d=JSON.parse(draft);
      if((d._base||'')!==(live.savedAt||'')){ LS.del('pf_draft'); }          // a newer file was uploaded → old draft is stale
      else if(SS.get('pf_admin')==='1'){ C = merge(live, d); previewing = true; } }catch(e){ LS.del('pf_draft'); } }
  return {C, live, previewing};
}

loadConfig().then(({C, live, previewing}) => {
  build(C);
  animate();
  setupAdmin(C, live, previewing);
});

/* ======================= BUILD ======================= */
function build(C){
  const th = C.theme || {}, root = document.documentElement.style;
  for(const k in th){ if(th[k]) root.setProperty('--'+k, th[k]); }
  const T = C.text || {};
  const fo = C.fonts || {};
  const loadFont = (fam) => { if(!fam || /^(Anton|Space Grotesk)$/i.test(fam)) return; const q=encodeURIComponent(fam).replace(/%20/g,'+');
    const l=document.createElement('link'); l.rel='stylesheet'; l.href=`https://fonts.googleapis.com/css2?family=${q}:wght@400;700&display=swap`;
    l.onerror=()=>{ l.onerror=null; l.href=`https://fonts.googleapis.com/css2?family=${q}&display=swap`; }; document.head.appendChild(l); };
  loadFont(fo.display); loadFont(fo.body);
  if(fo.display) root.setProperty('--display', `'${fo.display}', Impact, sans-serif`);
  if(fo.body) root.setProperty('--body', `'${fo.body}', system-ui, sans-serif`);
  if(fo.heroSize) root.setProperty('--herovw', fo.heroSize);
  if(fo.bodySize) root.setProperty('--bodysize', fo.bodySize+'px');

  /* ---- section visibility ---- */
  const show = C.show || {};
  const drop = sel => document.querySelectorAll(sel).forEach(el=>el.remove());
  if(show.about===false) drop('#about');
  if(show.projects===false) drop('#projects-intro, #projects');
  if(show.journey===false) drop('#chronicle, #journey');
  if(show.services===false) drop('#services');
  if(show.contact===false) drop('#contact');
  if(show.nav===false) drop('header nav');
  document.querySelectorAll('header nav a').forEach(a=>{ if(!document.querySelector(a.getAttribute('href'))) a.remove(); });

  /* ---- all small texts ---- */
  const html = s => esc(s).replace(/\n/g,'<br>');
  document.querySelectorAll('[data-text]').forEach(el=>{ const v=T[el.dataset.text]; if(v!=null) el.innerHTML=html(v); });
  document.querySelectorAll('[data-ph]').forEach(el=>{ const v=T[el.dataset.ph]; if(v!=null) el.placeholder=v; });
  const ck=$('#checklist'); if(ck) ck.innerHTML=String(T.checklist||'').split('\n').filter(x=>x.trim()).map(x=>`<div>${esc(x)}</div>`).join('');

  /* ---- SEO ---- */
  const seo = C.seo || {};
  const title = seo.title || `${C.name} — ${C.role} Portfolio`;
  document.title = title;
  const setMeta = (attr, key, val) => { if(!val) return; let m = document.head.querySelector(`meta[${attr}="${key}"]`); if(!m){ m = document.createElement('meta'); m.setAttribute(attr, key); document.head.appendChild(m);} m.setAttribute('content', val); };
  setMeta('name','description', seo.description); setMeta('name','keywords', seo.keywords); setMeta('name','author', C.name);
  setMeta('property','og:title', title); setMeta('property','og:description', seo.description); setMeta('property','og:type','website');
  setMeta('name','twitter:card','summary'); setMeta('name','twitter:title', title); setMeta('name','twitter:description', seo.description);
  if(seo.siteUrl){ setMeta('property','og:url', seo.siteUrl); let l=$('link[rel=canonical]'); if(!l){l=document.createElement('link'); l.rel='canonical'; document.head.appendChild(l);} l.href=seo.siteUrl; }


  /* ---- text ---- */
  $('#logo').textContent = C.name; $('#rolePill').textContent = C.role;
  $('#h1a').textContent = C.heroLine1; $('#h1b').textContent = C.heroLine2; $('#heroSub').textContent = C.heroSub;
  const setT=(sel,v)=>{const el=$(sel); if(el) el.textContent=v;};
  setT('#bio', C.about); if($('#resumeBtn')) $('#resumeBtn').href = C.resumeUrl || '#';
  (C.stats||[]).slice(0,2).forEach((s,i)=>{const el=$('#stat'+i); if(!el) return; el.className='float stat '+(s.color||'red'); el.innerHTML=`${esc(s.value)}<small>${esc(s.label)}</small>`;});
  if($('#emailLink')){ $('#emailLink').textContent = C.email; $('#emailLink').href = 'mailto:'+C.email; }
  $('#footTag').textContent = C.footerTagline; $('#footName').textContent = C.name;
  $('#copy').textContent = `© ${new Date().getFullYear()} ${C.name}. ${T.copyright||''}`;

  /* ---- role wall (behind the toggle) ---- */
  const iconCols=['#ffe14d','#ff3d7f','#2fd65a','#1f5fe0','#c6f25a','#ff8a3d','#18c8e0','#a259ff','#ffffff','#ef2f3c','#f6cf1d','#61dafb'];
  const words = (C.wallWords&&C.wallWords.length)?C.wallWords:['Freelancer'], emo = C.wallEmojis||[];
  let rows='';
  for(let r=0;r<7;r++){ let ws='';
    for(let k=0;k<Math.max(2,Math.ceil(16/words.length));k++) words.forEach((w,i)=>{const j=(i+r*3)%words.length; ws+=`<span class="w ${(i+r)%4===1?'o':''}">${esc(words[j])}<i style="background:${iconCols[j%iconCols.length]}">${emo[j]?`<b>${esc(emo[j])}</b>`:''}</i></span>`;});
    rows+=`<div class="row">${ws}${ws}</div>`; }
  $('#tilt').innerHTML=rows;
  $('#toggle').addEventListener('click',()=>document.body.classList.toggle('stack-on'));
  $('#stackwall').addEventListener('click',()=>document.body.classList.remove('stack-on'));

  /* ---- daisy ---- */
  const daisy=(petals,detail)=>{let s='';for(let i=0;i<petals;i++){s+=`<g transform="rotate(${i*360/petals})"><ellipse cx="0" cy="-58" rx="21" ry="46" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>${detail?'<path d="M0,-22 L0,-88" stroke="#c9c2b6" stroke-width="1.6"/>':''}</g>`;}
    return s+`<circle r="30" fill="#f6cf1d" stroke="#1a1a1a" stroke-width="3"/><circle r="20" fill="#f9dc4a"/>`;};
  if($('#daisySvg')){ $('#daisySvg').innerHTML = daisy(12,true);

  document.querySelectorAll('[data-daisy]').forEach(el=>el.innerHTML=daisy(10,false));

  /* ---- clouds ---- */
  const cloudPath='M18,48 C4,48 2,32 14,28 C12,16 28,10 36,18 C40,4 64,2 70,16 C80,8 98,14 96,28 C110,30 110,48 98,48 Z';
  document.querySelectorAll('[data-cloud]').forEach(el=>el.innerHTML=`<path d="${cloudPath}" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>`);
  const makeClouds=(host,n)=>{let h='';for(let i=0;i<n;i++){const w=140+Math.random()*220;
    h+=`<svg class="cl" viewBox="0 0 112 52" style="width:${w}px;left:${Math.random()*95-5}%;top:${Math.random()*90}%" data-speed="${(Math.random()*.6+.2).toFixed(2)}"><path class="c1" d="${cloudPath}"/><path class="c2" d="M18,48 C10,48 8,40 14,36 C30,42 80,44 98,38 C104,42 102,48 98,48Z"/></svg>`;}
    host.innerHTML=h;};
  if($('#clouds0')) makeClouds($('#clouds0'),10); if($('#clouds1')) makeClouds($('#clouds1'),16);

  /* ---- projects ---- */
  const P = C.projects||[];
  if($('#projects')) $('#projects').innerHTML = P.map((p,i)=>{
    const dom = String(p.url||'').replace(/^https?:\/\//,'').replace(/\/$/,'');
    return `<article class="pcard" style="transform:rotate(${[-1.5,1.2,-0.8,1.6][i%4]}deg)">
      <div class="shot"><div class="chrome"><b></b><b></b><b></b><span>${esc(dom)}</span></div>
        <a class="art" href="${esc(p.url)}" target="_blank" rel="noopener" style="background:${esc(p.color||'#1b1b1f')};color:${esc(p.accent||'#fff')}">
          <span class="blob" style="width:260px;height:260px;right:-60px;top:-70px;background:${esc(p.accent||'#fff')};opacity:.25"></span>
          <span class="blob" style="width:140px;height:140px;right:90px;bottom:-40px;background:#fff;opacity:.12"></span>
          <span class="num">${String(i+1).padStart(2,'0')} / ${String(P.length).padStart(2,'0')}</span>
          <span class="big">${String(p.title||'').split(' ').map(esc).join('<br>')}</span></a></div>
      <div class="info"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>
        <div class="tags">${(p.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>
        <span class="domain">${esc(dom)}</span>
        <a class="visit" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(T.visitBtn||'Visit live site')} <span>↗</span></a></div>
    </article>`;}).join('');

  /* ---- chronicle ---- */
  if($('#chronTitle')) $('#chronTitle').innerHTML = [T.chronicle1||'Career',T.chronicle2||'Chronicle'].map(w=>`<span style="display:block">${[...w].map(c=>`<span class="ch">${c}</span>`).join('')}</span>`).join('');

  /* ---- journey road ---- */
  if($('#roadWrap')){
  const D='M 40 590 C 260 600, 360 520, 600 520 S 980 520, 1040 430 S 1060 300, 800 300 S 320 310, 230 230 S 320 90, 640 100 S 1020 110, 1160 30';
  document.querySelectorAll('#roadSvg .rp, #maskPath').forEach(p=>p.setAttribute('d',D));
  const roadWrap=$('#roadWrap'), mp=$('#maskPath'), L=mp.getTotalLength();
  mp.style.strokeDasharray=L; mp.style.strokeDashoffset=L;
  const J=C.journey||[], n=J.length;
  J.forEach((j,i)=>{
    const f = n>1 ? 0.02 + i*(0.91/(n-1)) : 0.5; const pt=mp.getPointAtLength(L*f);

    const ig=(C.socials||{}).instagram||{}; const pts=(j.points||[]).map(esc);
    if(j.when==='instagram' && ig.url) pts.unshift(`<a href="${esc(ig.url)}" target="_blank" rel="noopener">${esc(ig.handle)}</a> on Instagram`);
    const card=document.createElement('div'); card.className='jcard';

  });
  const plane=document.createElement('span'); plane.className='plane'; plane.textContent='✈️'; roadWrap.appendChild(plane);
  }

  /* ---- services ---- */
  if($('#svcGrid')) $('#svcGrid').innerHTML = (C.services||[]).map((s,i)=>`<div class="sticker svc" style="transform:rotate(${[-1.5,1,-0.5,1.5,-1][i%5]}deg)"><span class="ico">${esc(s.icon)}</span><span class="tag ${['yellow','lime','yellow','red','lime'][i%5]}">${esc(s.title)}</span><p>${esc(s.desc)}</p></div>`).join('');

  /* ---- socials ---- */
  const ICONS={
    instagram:{bg:'linear-gradient(45deg,#f09433,#dc2743,#bc1888)',label:'Instagram',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg>'},

  };
  const soc = Object.entries(C.socials||{}).filter(([k,v])=>v&&v.url&&ICONS[k]);
  if($('#socialList')) $('#socialList').innerHTML = soc.map(([k,v],i)=>`<a class="sticker social" href="${esc(v.url)}" target="_blank" rel="noopener" style="transform:rotate(${i%2?0.8:-0.8}deg)"><span class="si" style="background:${ICONS[k].bg}">${ICONS[k].svg}</span><span><b>${ICONS[k].label}</b><small>${esc(v.handle)}</small></span><span class="go">↗</span></a>`).join('');
  $('#footLinks').innerHTML = soc.map(([k,v])=>`<a href="${esc(v.url)}" target="_blank" rel="noopener">${ICONS[k].label}</a>`).join(' &nbsp;·&nbsp; ');

  /* ---- footer bands ---- */
  const bandHtml = Array(6).fill(`<span>${esc(T.bandText||'')}</span><span class="em">${esc(T.bandEmoji||'')}</span>`).join('');
  $('#bandA').innerHTML=bandHtml; $('#bandB').innerHTML=bandHtml;

  /* ---- mobile menu ---- */
  const mb=$('#menuBtn'); if(mb){ if(!document.querySelector('header nav a')) mb.remove();
    else { mb.onclick=()=>document.body.classList.toggle('menu-on'); document.querySelectorAll('header nav a').forEach(a=>a.addEventListener('click',()=>document.body.classList.remove('menu-on'))); } }

  /* ---- cloud eyes ---- */
  const pupils=[...document.querySelectorAll('#cloudy .pupil')], base=[[92,88],[128,88]];
  window.addEventListener('pointermove',e=>{if(!$('#cloudy')) return; const r=$('#cloudy').getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
    const cx=r.left+r.width/2, cy=r.top+r.height*.58, a=Math.atan2(e.clientY-cy,e.clientX-cx), d=Math.min(5,Math.hypot(e.clientX-cx,e.clientY-cy)/40);
    pupils.forEach((p,i)=>{p.setAttribute('cx',base[i][0]+Math.cos(a)*d);p.setAttribute('cy',base[i][1]+Math.sin(a)*d*1.3);});});

  /* ---- form ---- */
  if($('#cform')) $('#cform').addEventListener('submit',async e=>{
    e.preventDefault();
    const f=e.target, msg=$('#formMsg'), name=f.name.value.trim(), email=f.email.value.trim(), text=f.message.value.trim();
    msg.style.display='block';
    if(!name||!/^\S+@\S+\.\S+$/.test(email)||!text){msg.innerHTML='Please fill in your name, a valid email and a message 🙏';return;}
    if(C.formEndpoint){ try{const r=await fetch(C.formEndpoint,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify({name,email,message:text})});
        if(r.ok){msg.innerHTML=`Thanks ${esc(name)}! Your message is on its way — I'll reply soon ✨`;f.reset();return;}}catch(err){} }
    const href=`mailto:${C.email}?subject=${encodeURIComponent('Project enquiry from '+name)}&body=${encodeURIComponent(text+'\n\n— '+name+' ('+email+')')}`;
    msg.innerHTML=`Almost there, ${esc(name)}! <a href="${href}" style="font-weight:700;text-decoration:underline">Click here to send it from your email app</a>, or write to <b>${esc(C.email)}</b>.`;
  });
}

/* ======================= ANIMATIONS ======================= */
function animate(){
  const mp=$('#maskPath'), L=mp?mp.getTotalLength():0, plane=$('.plane');
  if(!window.gsap || matchMedia('(prefers-reduced-motion: reduce)').matches){ if(mp) mp.style.strokeDashoffset=0; const fl=$('#projects-intro .flash'); if(fl) fl.style.display='none'; const sr=$('#chronicle .skyreveal'); if(sr) sr.style.clipPath='inset(0)'; return; }
  gsap.registerPlugin(ScrollTrigger);
  ScrollTrigger.config({ignoreMobileResize:true});
  gsap.config({nullTargetWarn:false});
  const has = s => !!$(s);
  gsap.from('#toggle',{scale:3.2,y:'40vh',duration:1.4,ease:'expo.out'});
  gsap.from('#hero h1 .line span',{yPercent:110,duration:1.1,ease:'power4.out',stagger:.12,delay:.35});

  if(has('#about')){
  gsap.fromTo('#daisy',{yPercent:60,scale:.55,rotate:-60},{yPercent:0,scale:1,rotate:0,ease:'none',scrollTrigger:{trigger:'#about',start:'top bottom',end:'center center',scrub:1}});
  gsap.to('#daisySvg',{rotate:120,ease:'none',scrollTrigger:{trigger:'#about',start:'top bottom',end:'bottom top',scrub:1}});
  gsap.from('#daisy .float',{scale:0,opacity:0,stagger:.12,ease:'back.out(2.2)',duration:.7,scrollTrigger:{trigger:'#about .stage',start:'top 35%'}});
  gsap.from('.about-side',{x:i=>i?80:-80,opacity:0,duration:1,ease:'power3.out',scrollTrigger:{trigger:'#about .stage',start:'top 45%'}});
  gsap.from('#about h2',{yPercent:60,opacity:0,duration:1,ease:'power3.out',scrollTrigger:{trigger:'#about .stage',start:'top 60%'}});
  }
  if(has('#projects-intro')){

  gsap.fromTo('#projects-intro .flash',{clipPath:'circle(75% at 50% 50%)'},{clipPath:'circle(0% at 50% 50%)',ease:'power2.in',scrollTrigger:{trigger:'#projects-intro',start:'top top',end:'+=80%',scrub:true,pin:true}});
  gsap.from('#projects-intro h2',{scale:.6,opacity:0,scrollTrigger:{trigger:'#projects-intro',start:'top top',end:'+=80%',scrub:true}});
  gsap.utils.toArray('.pcard').forEach((c,i)=>gsap.from(c,{y:160,rotate:i%2?10:-10,opacity:0,duration:1,ease:'power3.out',scrollTrigger:{trigger:c,start:'top 92%'}}));
  }
  if(has('#journey')){

  const tl=gsap.timeline({scrollTrigger:{trigger:'#chronicle',start:'top top',end:'+=170%',scrub:1,pin:true}});
  tl.from('#chronTitle .ch',{x:()=>gsap.utils.random(-500,500),y:()=>gsap.utils.random(-350,350),rotate:()=>gsap.utils.random(-120,120),opacity:0,ease:'power2.out',stagger:{each:.02,from:'random'}})
    .to('#chronicle .skyreveal',{clipPath:'inset(0% 0% 0% 0% round 0px)',ease:'power2.inOut'},'+=0.15');

  const jcards=[...document.querySelectorAll('.jcard, .jpin')], st={p:0};
  if(innerWidth>1000) gsap.set(jcards,{opacity:0});
  gsap.to(st,{p:1,ease:'none',scrollTrigger:{trigger:'#roadWrap',start:'top 70%',end:'bottom 45%',scrub:1},onUpdate(){
    mp.style.strokeDashoffset=L*(1-st.p);
    const pt=mp.getPointAtLength(L*Math.max(.001,st.p)), pt2=mp.getPointAtLength(L*Math.min(1,st.p+.005));
    plane.style.left=pt.x/12+'%'; plane.style.top=pt.y/6.4+'%';
    plane.style.transform=`translate(-50%,-50%) rotate(${Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI+45}deg)`;
    if(innerWidth<=1000) return;
    jcards.forEach(c=>{const on=st.p>=parseFloat(c.dataset.f)-.01; if(on!==!!c._on){c._on=on; gsap.to(c,{opacity:on?1:0,scale:on?1:.6,duration:.4,ease:on?'back.out(2)':'power1.in',overwrite:'auto'});}});
  }});
  gsap.utils.toArray('.cl').forEach(c=>gsap.to(c,{xPercent:()=>60*c.dataset.speed,ease:'none',scrollTrigger:{trigger:c.closest('section'),start:'top bottom',end:'bottom top',scrub:true}}));
  gsap.from('.journey-title',{scale:0,rotate:-20,duration:.8,ease:'back.out(2)',scrollTrigger:{trigger:'#journey',start:'top 60%'}});
  }
  if(has('#services')){

  gsap.from('.svc-title .box',{scale:.3,rotate:-15,opacity:0,duration:.9,ease:'back.out(1.8)',scrollTrigger:{trigger:'#services',start:'top 60%'}});
  gsap.from('.svc',{y:80,opacity:0,stagger:.1,duration:.8,ease:'back.out(1.6)',scrollTrigger:{trigger:'#svcGrid',start:'top 80%'}});
  gsap.utils.toArray('#services .blob').forEach((b,i)=>gsap.from(b,{scale:0,duration:1.2,ease:'elastic.out(1,.6)',delay:i*.08,scrollTrigger:{trigger:'#services',start:'top 70%'}}));
  }
  if(has('#contact')){

  gsap.from('#contact .sticker, #cform, #cloudy, .monitor',{y:60,opacity:0,stagger:.07,duration:.7,ease:'power3.out',scrollTrigger:{trigger:'.contact-grid',start:'top 80%'}});
  gsap.to('#cloudy',{y:-10,duration:2,yoyo:true,repeat:-1,ease:'sine.inOut'});
  gsap.to('#contact [data-daisy]',{rotate:360,duration:18,repeat:-1,ease:'none'});
  }

  gsap.from('.foot-name',{yPercent:60,opacity:0,duration:1.2,ease:'power4.out',scrollTrigger:{trigger:'footer',start:'top 60%'}});
  gsap.from('.band.a',{rotate:-18,xPercent:-10,ease:'none',scrollTrigger:{trigger:'footer',start:'top bottom',end:'top 30%',scrub:true}});
  gsap.from('.band.b',{rotate:16,xPercent:10,ease:'none',scrollTrigger:{trigger:'footer',start:'top bottom',end:'top 30%',scrub:true}});
  window.addEventListener('load',()=>ScrollTrigger.refresh());
  setTimeout(()=>ScrollTrigger.refresh(),800);
}

/* ======================= ADMIN ======================= */
function setupAdmin(C, live, previewing){
  const sha = async s => { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); };
  let W = structuredClone(C);  // working copy
  W._base = live.savedAt || '';
  const ver = live.savedAt ? new Date(live.savedAt).toLocaleString() : 'original file (never saved from admin)';
  document.querySelectorAll('.adm-ver').forEach(e=>e.textContent='This page’s file: '+ver);
  let tab = 'general';

  if(previewing){ const bar=$('#draftBar'); bar.style.display='flex';
    bar.innerHTML=`<span>👀 Previewing your unpublished changes</span><button id="dbEdit" style="background:#ffe14d">Keep editing</button><button id="dbDiscard" style="background:#fff">Discard</button>`;
    $('#dbEdit').onclick=()=>openPanel(); $('#dbDiscard').onclick=()=>{LS.del('pf_draft'); location.reload();}; }

  const openLogin = () => { if(SS.get('pf_admin')==='1') return openPanel(); $('#adm-login').classList.add('on'); $('#pin').value=''; $('#pinErr').textContent=''; setTimeout(()=>$('#pin').focus(),50); };
  document.addEventListener('click', e => { if(e.target.id==='openAdmin') openLogin(); });
  document.addEventListener('keydown', e => { if(e.ctrlKey && e.shiftKey && (e.key==='A'||e.key==='a')){ e.preventDefault(); openLogin(); } if(e.key==='Escape'){ $('#adm-login').classList.remove('on'); $('#adm').classList.remove('on'); } });
  if(location.hash==='#admin') setTimeout(openLogin, 400);
  let taps=0, tapT; const lg=$('#logo'); if(lg) lg.addEventListener('click',()=>{ taps++; clearTimeout(tapT); tapT=setTimeout(()=>taps=0,1500); if(taps>=5){ taps=0; openLogin(); } });
  window.addEventListener('hashchange',()=>{ if(location.hash==='#admin') openLogin(); });

  $('#pinCancel').onclick=()=>$('#adm-login').classList.remove('on');
  const tryLogin = async () => {
    const ok = (await sha($('#pin').value.trim())) === (live.adminHash || C.adminHash);
    if(ok){ SS.set('pf_admin','1'); $('#adm-login').classList.remove('on'); openPanel(); }
    else { $('#pinErr').textContent='Wrong PIN — try again'; $('#pin').value=''; }
  };
  $('#pinGo').onclick=tryLogin; $('#pin').addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin(); });

  function openPanel(){ $('#adm').classList.add('on'); renderTab(); }
  $('#admClose').onclick=()=>$('#adm').classList.remove('on');
  $('#adm .shade').onclick=()=>$('#adm').classList.remove('on');
  document.querySelectorAll('#adm .tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; renderTab(); });

  /* path helpers */
  const getP = p => p.split('.').reduce((o,k)=>o==null?o:o[k], W);
  const setP = (p, v) => { const ks=p.split('.'); let o=W; ks.slice(0,-1).forEach((k,i)=>{ if(o[k]==null) o[k]=/^\d+$/.test(ks[i+1])?[]:{}; o=o[k]; }); o[ks.at(-1)]=v; };

  const F = (path, label, type='text', help='', opts) => {
    let v = getP(path); const id='f_'+path.replace(/\./g,'_');
    let input;
    if(type==='textarea') input=`<textarea id="${id}" data-p="${path}">${esc(v)}</textarea>`;
    else if(type==='list') input=`<input id="${id}" data-p="${path}" data-kind="list" value="${esc((v||[]).join(', '))}">`;
    else if(type==='lines') input=`<textarea id="${id}" data-p="${path}" data-kind="lines">${esc((v||[]).join('\n'))}</textarea>`;
    else if(type==='select') input=`<select id="${id}" data-p="${path}">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(type==='color') input=`<input id="${id}" type="color" data-p="${path}" value="${esc(v||'#000000')}">`;
    else if(type==='bool') return `<div class="af"><label class="chk"><input id="${id}" type="checkbox" data-p="${path}" data-kind="bool" ${v!==false?'checked':''}>${label}</label>${help?`<small>${help}</small>`:''}</div>`;
    else if(type==='font') input=`<input id="${id}" data-p="${path}" list="fontList" value="${esc(v)}" placeholder="Type any Google Font name"><div class="fprev" data-fprev="${path}" style="font-family:'${esc(v)}'">${esc(opts||'Aa Bb Cc 123')}</div>`;
    else if(type==='number') input=`<input id="${id}" type="number" step="any" data-p="${path}" data-kind="num" value="${esc(v)}">`;
    else input=`<input id="${id}" type="${type}" data-p="${path}" value="${esc(v)}">`;
    return `<div class="af"><label for="${id}">${label}</label>${input}${help?`<small>${help}</small>`:''}</div>`;
  };
  const listUI = (key, title, itemFn, blank) => {
    const arr = W[key] || (W[key]=[]);
    return arr.map((it,i)=>`<div class="aitem"><div class="ahead"><b>${esc(title)} ${i+1}${it.title||it.tag?': '+esc(it.title||it.tag):''}</b>
      <button class="abtn sm" data-mv="${key}.${i}.-1" title="Move up">↑</button><button class="abtn sm" data-mv="${key}.${i}.1" title="Move down">↓</button><button class="abtn sm warn" data-rm="${key}.${i}">Remove</button></div>${itemFn(i)}</div>`).join('')
      + `<button class="abtn" data-add="${key}">+ Add ${esc(title.toLowerCase())}</button>`;
    void blank;
  };
  const loaded=new Set(['Anton','Space Grotesk']);
  const loadPreviewFont = fam => { if(!fam||loaded.has(fam)) return; loaded.add(fam); const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(fam).replace(/%20/g,'+')+'&display=swap'; document.head.appendChild(l); };
  $('#fontList').innerHTML=['Anton','Bebas Neue','Oswald','Archivo Black','Alfa Slab One','Bungee','Righteous','Russo One','Black Ops One','Monoton','Bowlby One','Dela Gothic One','Rubik Mono One','Syne','Unbounded','Space Grotesk','Poppins','Inter','Montserrat','Outfit','Sora','Manrope','DM Sans','Plus Jakarta Sans','Urbanist','Lexend','Rubik','Nunito','Roboto','Open Sans','Lato','Raleway','Work Sans','Playfair Display','Fraunces','DM Serif Display','Abril Fatface','Caveat','Pacifico','Permanent Marker','Press Start 2P','VT323','Space Mono','JetBrains Mono','Fira Code','Baloo 2','Poppins','Mukta','Hind'].map(f=>`<option value="${f}">`).join('');
  let saveT; const autosave = () => { clearTimeout(saveT); saveT=setTimeout(()=>LS.set('pf_draft', JSON.stringify(W)),400); };
  const CS='/*CFG-'+'START*/', CE='/*CFG-'+'END*/';
  const bake = (src) => { const a=src.indexOf(CS), b=src.indexOf(CE); if(a<0||b<0) throw new Error('Could not find the settings block in index.html');
    const out=structuredClone(W); delete out._base; out.savedAt=new Date().toISOString(); lastSaved=out.savedAt;
    let res = src.slice(0,a+CS.length) + 'const DEFAULT_CONFIG = ' + JSON.stringify(out).replace(/</g,'\\u003c') + ';' + src.slice(b);
    const SS='<'+'!--SEO-START-->', SE='<'+'!--SEO-END-->', x=res.indexOf(SS), y=res.indexOf(SE);
    if(x>=0 && y>x) res = res.slice(0,x+SS.length) + seoHead(out) + res.slice(y);
    return res; };
  let lastSaved='';
  const BLANK = {
    projects:{title:'New Project',url:'https://',desc:'',tags:[],color:'#1b1b1f',accent:'#ffe14d'},
    journey:{tag:'Milestone',when:'',color:'yellow',points:['Something I did']},
    services:{icon:'✨',title:'New Service',desc:''},
  };

  function renderTab(){
    document.querySelectorAll('#adm .tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));

      general: ()=>`<h4 class="asec">Basics</h4>${F('name','Your name')}${F('role','Title / role (green pill)')}

        <h4 class="asec">About</h4>${F('about','About me','textarea')}
        <div class="af"><label>Photo in the daisy (optional)</label>${W.photo?`<img class="photo-prev" src="${esc(W.photo)}" alt="">`:''}<input type="file" id="photoIn" accept="image/*"><small>Shown in the centre of the big daisy. It’s resized automatically.</small>${W.photo?'<button class="abtn sm warn" id="photoDel" style="margin-top:6px">Remove photo</button>':''}</div>
        <div class="agrid">${F('stats.0.value','Badge 1 number')}${F('stats.0.label','Badge 1 label')}${F('stats.1.value','Badge 2 number')}${F('stats.1.label','Badge 2 label')}</div>
        <div class="agrid">${F('stats.0.color','Badge 1 colour','select','',['red','yellow','lime'])}${F('stats.1.color','Badge 2 colour','select','',['red','yellow','lime'])}</div>
        ${F('resumeUrl','Resume link','url','Paste a Google Drive / PDF link. Set sharing to “Anyone with the link”.')}
        <h4 class="asec">Contact & footer</h4>${F('email','Email','email')}${F('formEndpoint','Form endpoint (optional)','url','Free at formspree.io — paste your form URL and messages arrive in your inbox. Leave empty to open the visitor’s email app instead.')}
        ${F('footerTagline','Footer tagline')}`,
      texts: ()=>{ const g=(t,keys)=>`<h4 class="asec">${t}</h4>`+keys.map(([k,l,ty])=>F('text.'+k,l,ty||'text')).join('');
        return `<div class="anote">Every word on the site. Press Enter in the bigger boxes to start a new line.</div>`
        +g('Top menu',[['navAbout','About link'],['navWork','Work link'],['navJourney','Journey link'],['navServices','Services link'],['navContact','Contact link'],['toggleHint','Hint under the switch']])
        +g('About',[['aboutTitle','Big title'],['aboutL1','Left word 1 (yellow)'],['aboutL2','Left word 2 (green)'],['aboutL3','Left word 3'],['aboutR1','Right word 1 (yellow)'],['aboutR2','Right word 2 (green)'],['aboutR3','Right word 3'],['resumeBtn','Resume button'],['contactBtn','Contact button']])
        +g('Projects',[['projectsTitle','Big title','textarea'],['projectsSub','Subtitle'],['visitBtn','Visit button']])

        ${F('seo.googleMeta','Google verification code (easiest)','text','Search Console → URL prefix → “HTML tag” method. Paste the whole tag or just the code inside content="…". It gets written into your page when you Save file / Publish.')}
        ${F('seo.googleVerificationFile','Google verification file name (optional)','text','Only for the “HTML file” method, e.g. google1a2b3c4d5e.html. Publish creates that file in your repo.')}`,
      publish: ()=>`<div class="anote"><b>Your changes are auto-saved in this browser</b> while you edit. To make them public, choose one:<br><br>
        <b>💾 Save file</b>: downloads a new <b>index.html</b> with everything inside. Upload it to GitHub to replace the old one.<br>
        <b>🚀 Publish</b>: updates index.html on GitHub for you in one click (needs the one-time setup below).<br><br>
        Visitors never see an Admin button. Only someone with your PIN <b>and</b> your GitHub account or token can change the public site.</div>
        <h4 class="asec">GitHub repo</h4><div class="agrid">${F('github.owner','GitHub username')}${F('github.repo','Repo name')}</div><div class="agrid">${F('github.branch','Branch')}${F('github.path','File path','text','Usually index.html')}</div>
        <div class="af"><label for="ghToken">GitHub token</label><input id="ghToken" type="password" value="${esc(LS.get('pf_gh_token')||'')}" placeholder="github_pat_…"><small>Create one at github.com → Settings → Developer settings → Fine-grained tokens. Repository access: only this repo. Permission: <b>Contents → Read and write</b>. It is stored only in this browser, never in the site.</small></div>
        <h4 class="asec">Admin PIN</h4><div class="af"><label for="newPin">New PIN (optional)</label><input id="newPin" type="password" inputmode="numeric" placeholder="Leave empty to keep the current PIN"></div>
        <div class="amsg" id="pubMsg"></div>`
    };
    $('#adm .body').innerHTML = T[tab]();
    $('#adm .body').querySelectorAll('[data-p]').forEach(el=>el.addEventListener('input',()=>{
      const k=el.dataset.kind; let v=el.value;
      if(k==='list') v=v.split(',').map(s=>s.trim()).filter(Boolean);
      if(k==='lines') v=v.split('\n').map(s=>s.trim()).filter(Boolean);
      if(k==='bool') v=el.checked;
      if(k==='num') v=parseFloat(v)||'';
      setP(el.dataset.p, v); autosave();
      const fp=$(`[data-fprev="${el.dataset.p}"]`); if(fp){ fp.style.fontFamily=`'${v}'`; loadPreviewFont(v); }
    }));
    $('#adm .body').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ W[b.dataset.add].push(structuredClone(BLANK[b.dataset.add])); autosave(); renderTab(); $('#adm .body').scrollTop=1e6; });
    $('#adm .body').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const [k,i]=b.dataset.rm.split('.'); W[k].splice(+i,1); autosave(); renderTab(); });
    $('#adm .body').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{ const [k,i,d]=b.dataset.mv.split('.'); const a=W[k], j=+i + +d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; autosave(); renderTab(); });
    document.querySelectorAll('[data-fprev]').forEach(fp=>loadPreviewFont(getP(fp.dataset.fprev)));
    const pin=$('#photoIn'); if(pin) pin.onchange=()=>{ const f=pin.files[0]; if(!f) return; const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'), S=320, m=Math.min(img.width,img.height); c.width=c.height=S; c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S); W.photo=c.toDataURL('image/jpeg',.82); autosave(); renderTab(); }; img.src=URL.createObjectURL(f); };
    const pdel=$('#photoDel'); if(pdel) pdel.onclick=()=>{ W.photo=''; autosave(); renderTab(); };
    const tok=$('#ghToken'); if(tok) tok.addEventListener('input',()=>LS.set('pf_gh_token',tok.value.trim()));
  }

  const msg = (t, kind) => { let m=$('#pubMsg'); if(!m){ tab='publish'; renderTab(); m=$('#pubMsg'); } m.className='amsg on '+kind; m.innerHTML=t; };
  const applyPin = async () => { const np=$('#newPin'); if(np && np.value.trim()){ if(!/^\d{4,8}$/.test(np.value.trim())) throw new Error('PIN must be 4–8 digits'); W.adminHash = await sha(np.value.trim()); } };

  $('#admPreview').onclick=async()=>{ try{ await applyPin(); }catch(e){ return msg(e.message,'bad'); } LS.set('pf_draft', JSON.stringify(W)); location.hash=''; location.reload(); };
  $('#admDownload').onclick=async()=>{
    try{ await applyPin(); }catch(e){ return msg(e.message,'bad'); }
    let src; try{ const r=await fetch(location.pathname.endsWith('/')?location.pathname+'index.html':location.pathname,{cache:'no-store'}); if(!r.ok) throw 0; src=await r.text(); }catch(e){ src=null; }
    if(!src) return msg('Couldn’t read the page file here. Open the admin on your live site to download.','bad');
    let out; try{ out=bake(src); }catch(e){ return msg(e.message,'bad'); }
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'text/html'})); a.download='index.html'; document.body.appendChild(a); a.click(); a.remove();
      msg(`💾 New <b>index.html</b> downloaded (version <b>${new Date(lastSaved).toLocaleString()}</b>).<br>• Make sure the file is named exactly <b>index.html</b>, not “index (1).html”. Rename it if needed.<br>• Upload it to GitHub → Commit → wait 1–2 min → open your site with <b>#admin</b>. The version shown at the top of this panel should match.`,'good'); }
    catch(e){ msg('Download was blocked by this viewer. Use it on your live site.','bad'); }
  };
  $('#admLogout').onclick=()=>{ SS.del('pf_admin'); LS.del('pf_draft'); location.hash=''; location.reload(); };

  $('#admPublish').onclick=async()=>{
    if(tab!=='publish'){ tab='publish'; renderTab(); }
    try{ await applyPin(); }catch(e){ return msg(e.message,'bad'); }
    const g=W.github||{}, token=LS.get('pf_gh_token');
    if(!g.owner||!g.repo||!token) return msg('Fill in your GitHub username, repo name and token first.','bad');
    const api=`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/`;
    const H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'};
    const b64 = s => { const bytes=new TextEncoder().encode(s); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin); };
    const put = async (path, content) => {
      let sha; const r0=await fetch(api+path+'?ref='+encodeURIComponent(g.branch||'main'),{headers:H,cache:'no-store'}); if(r0.ok) sha=(await r0.json()).sha; else if(r0.status===401||r0.status===403) throw new Error('GitHub refused the token (check it has Contents: Read and write on this repo).');
      const r=await fetch(api+path,{method:'PUT',headers:H,body:JSON.stringify({message:`Update ${path} from admin panel`,content:b64(content),branch:g.branch||'main',sha})});
      if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(`${path}: ${j.message||r.status}`); }
    };
    msg('Publishing…','info');
    try{
      const url=(W.seo&&W.seo.siteUrl||'').trim(); const base=url?url.replace(/\/?$/,'/'):'';
      const file=(g.path||'index.html').replace(/^\/+/,'');
      const r0=await fetch(api+file+'?ref='+encodeURIComponent(g.branch||'main'),{headers:H,cache:'no-store'});
      if(r0.status===401||r0.status===403) throw new Error('GitHub refused the token (check it has Contents: Read and write on this repo).');
      if(!r0.ok) throw new Error(`Couldn’t find ${file} in ${g.owner}/${g.repo} (branch ${g.branch||'main'}).`);
      const cur=await r0.json(); const bin=atob(cur.content.replace(/\n/g,'')); const src=new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
      await put(file, bake(src));
      await put('robots.txt', `User-agent: *\nAllow: /\n${base?`Sitemap: ${base}sitemap.xml\n`:''}`);
      if(base) await put('sitemap.xml', `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>${base}</loc><lastmod>${new Date().toISOString().slice(0,10)}</lastmod><priority>1.0</priority></url>\n</urlset>\n`);
      const gv=(W.seo&&W.seo.googleVerificationFile||'').trim(); if(/^google[a-z0-9]+\.html$/i.test(gv)) await put(gv, `google-site-verification: ${gv}`);
      LS.del('pf_draft');
      msg('✅ Published! GitHub Pages updates in about 1 minute — then refresh your site.','good');
    }catch(e){ msg('❌ '+esc(e.message)+'<br><small>If this keeps failing, use “💾 Save file” and upload the new index.html to GitHub yourself.</small>','bad'); }
  };
}
})();

</script>
</body>
</html>
